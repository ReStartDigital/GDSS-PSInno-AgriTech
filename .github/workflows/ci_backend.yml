name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Code Quality (Linter)
        run: |
          cd backend
          npm run lint

      - name: TypeScript Compilation Check
        run: |
          cd backend
          npm run build

      - name: Run test
        run: |
          cd backend
          npm run test

  deploy:
    name: Production Deployment
    needs: test
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Step
        run: echo "Triggering deployment script to hosting provider (Render/AWS)..."